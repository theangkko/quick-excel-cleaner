name: CI

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and Test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@v7

      - name: Verify source identity
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          Write-Host "Expected SHA: $env:GITHUB_SHA"
          Write-Host "Checked out SHA: $actual"
          if ($actual -ne $env:GITHUB_SHA) {
            throw "Checked out commit does not match GITHUB_SHA."
          }

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.400'
          cache: false

      - name: Verify .NET SDK
        shell: pwsh
        run: |
          dotnet --version
          dotnet --info

      - name: Restore
        run: dotnet restore QuickExcelCleaner.sln

      - name: Build
        run: dotnet build QuickExcelCleaner.sln -c Release --no-restore --nologo

      - name: Integration tests
        run: dotnet run --project tests/QuickExcelCleaner.Tests/QuickExcelCleaner.Tests.csproj -c Release --no-build --nologo

  publish-win-x64:
    name: Publish Windows x64
    needs: build-test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@v7

      - name: Verify source identity
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          Write-Host "Expected SHA: $env:GITHUB_SHA"
          Write-Host "Checked out SHA: $actual"
          if ($actual -ne $env:GITHUB_SHA) {
            throw "Checked out commit does not match GITHUB_SHA."
          }

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.400'
          cache: false

      - name: Restore
        run: dotnet restore QuickExcelCleaner.sln

      - name: Publish self-contained single-file EXE
        run: >-
          dotnet publish src/QuickExcelCleaner/QuickExcelCleaner.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/QuickExcelCleaner

      - name: Validate published EXE
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'artifacts/QuickExcelCleaner/QuickExcelCleaner.exe'
          if (-not (Test-Path $exe)) {
            throw "Published executable was not found: $exe"
          }
          $size = (Get-Item $exe).Length
          if ($size -lt 1MB) {
            throw "Published executable is unexpectedly small: $size bytes"
          }
          Write-Host "Commit SHA: $env:GITHUB_SHA"
          Write-Host "Published executable: $exe"
          Write-Host "Size: $size bytes"

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v6
        with:
          name: QuickExcelCleaner-win-x64
          path: artifacts/QuickExcelCleaner/QuickExcelCleaner.exe
          if-no-files-found: error
          retention-days: 14
