name: Build

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.400'
          cache: false

      - name: Show .NET SDK
        run: dotnet --info

      - name: Restore
        run: dotnet restore QuickExcelCleaner.sln

      - name: Build
        run: dotnet build QuickExcelCleaner.sln -c Release --no-restore

      - name: Integration tests
        run: dotnet run --project tests/QuickExcelCleaner.Tests/QuickExcelCleaner.Tests.csproj -c Release --no-build

      - name: Publish Windows x64
        run: dotnet publish src/QuickExcelCleaner/QuickExcelCleaner.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/QuickExcelCleaner

      - name: Upload publish artifact
        uses: actions/upload-artifact@v6
        with:
          name: QuickExcelCleaner-win-x64
          path: artifacts/QuickExcelCleaner/
