name: Build

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'
          cache: true
      - name: Show .NET SDK
        run: dotnet --info
      - name: Restore
        run: dotnet restore QuickExcelCleaner.sln
      - name: Build
        run: dotnet build QuickExcelCleaner.sln -c Release --no-restore
      - name: Scanner smoke test
        run: dotnet run --project tests/QuickExcelCleaner.Tests/QuickExcelCleaner.Tests.csproj -c Release --no-build
